[project]
name = "travel-planner"
version = "0.1.0"
description = "Multi-agent AI travel planner with LangGraph orchestration and human-in-the-loop approval, served via FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "chromadb>=1.5.9",
    "mcp>=1.3.0",
    "reportlab>=4.2.0",
    "psycopg[binary,pool]>=3.2.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
